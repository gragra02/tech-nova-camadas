<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TechNova - Assistente Virtual com RPA</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0d6efd, #004aad);
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            width: 90%;
            max-width: 800px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        header {
            background: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 70%;
            line-height: 1.4;
        }
        .bot { 
            background: #e9ecef; 
            color: #212529; 
            align-self: flex-start; 
            border-bottom-left-radius: 5px; 
        }
        .user { 
            background: #0d6efd; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 5px; 
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #dee2e6;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 1rem;
        }
        button {
            margin-left: 10px;
            padding: 12px 20px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #0b5ed7; }
    </style>
</head>
<body>
    <div class="container">
        <header>🤖 Assistente Virtual TechNova</header>
        <div class="chat-box" id="chatBox">
            <div class="msg bot">Olá! Eu sou o assistente da TechNova. Qual é o seu nome?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Digite aqui..." autofocus>
            <button onclick="enviar()">Enviar</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        let estado = 'aguardando_nome';
        let nomeUsuario = '';
        let produtoBusca = '';

        function adicionarMensagem(texto, tipo) {
            const msg = document.createElement('div');
            msg.className = `msg ${tipo}`;
            msg.innerHTML = texto.replace(/\n/g, '<br>');
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function enviar() {
            const texto = userInput.value.trim();
            if (!texto) return;
            adicionarMensagem(texto, 'user');
            userInput.value = '';

            if (estado === 'aguardando_nome') {
                nomeUsuario = texto;
                estado = 'perguntar_produto';
                adicionarMensagem(`Olá, ${nomeUsuario}! Posso te ajudar a encontrar produtos.`, 'bot');
                setTimeout(() => {
                    adicionarMensagem(`Qual produto você deseja pesquisar?`, 'bot');
                }, 800);
            }
            else if (estado === 'perguntar_produto') {
                produtoBusca = texto;
                const produtos = JSON.parse('{{ produtos_json|escapejs }}');
                const encontrado = produtos.find(p => p.fields.nome.toLowerCase().includes(texto.toLowerCase()));

                if (encontrado) {
                    estado = 'oferecer_comparacao';
                    adicionarMensagem(`Encontrei "${encontrado.fields.nome}" (R$ ${encontrado.fields.preco}) no nosso estoque!`, 'bot');
                    setTimeout(() => {
                        adicionarMensagem(`Deseja comparar o preço com outras lojas? Digite "sim" ou "não".`, 'bot');
                    }, 800);
                } else {
                    adicionarMensagem(`Desculpe, ${nomeUsuario}, não temos "${texto}" em estoque.`, 'bot');
                    setTimeout(() => {
                        adicionarMensagem(`Qual outro produto você deseja pesquisar?`, 'bot');
                    }, 1000);
                }
            }
            else if (estado === 'oferecer_comparacao') {
                if (texto.toLowerCase() === 'sim') {
                    adicionarMensagem(`🔍 Pesquisando preço de "${produtoBusca}" no Kabum... (Aguarde alguns segundos)`, 'bot');

                    fetch('{% url "iniciar_comparacao" %}', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken'),
                        },
                        body: JSON.stringify({ produto: produtoBusca }),
                    })
                    .then(r => r.json())
                    .then(data => {
                        let resposta = `📊 <strong>Resultado da comparação:</strong>\n\n`;
                        if (data.local) {
                            resposta += `🏠 <strong>No nosso site:</strong>\n${data.local.nome}\nR$ ${data.local.preco.toFixed(2)}\n\n`;
                        }
                        if (data.kabum && data.kabum.sucesso) {
                            resposta += `🛒 <strong>No Kabum:</strong>\nR$ ${data.kabum.preco.toFixed(2)}\n<a href="${data.kabum.url}" target="_blank">Ver no Kabum</a>\n\n`;
                        } else if (data.kabum) {
                            resposta += `⚠️ Não foi possível buscar no Kabum: ${data.kabum.mensagem}\n\n`;
                        }
                        if (data.comparacao && data.kabum && data.kabum.sucesso) {
                            const economia = data.comparacao.economia;
                            resposta += `💡 Você ${economia > 0 ? `pode economizar R$ ${economia.toFixed(2)} comprando aqui!` : `encontra por R$ ${Math.abs(economia).toFixed(2)} mais barato no Kabum.`}`;
                        }
                        adicionarMensagem(resposta, 'bot');
                        estado = 'perguntar_produto';
                        setTimeout(() => {
                            adicionarMensagem(`Deseja pesquisar outro produto? Digite o nome dele!`, 'bot');
                        }, 1500);
                    })
                    .catch(err => {
                        adicionarMensagem(`Erro na comparação: ${err.message}`, 'bot');
                        estado = 'perguntar_produto';
                    });
                } else {
                    adicionarMensagem(`Tudo bem! Qual outro produto você deseja pesquisar?`, 'bot');
                    estado = 'perguntar_produto';
                }
            }
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviar();
        });
    </script>
</body>
</html>
